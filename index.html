<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Tabla</title>
    <!-- Add to Home Screen: this page installs the MANAGER app. The front app has its own page, front/index.html,
         because iPhone Safari reads the manifest once, as the page loads, and ignores later changes: a script
         that swapped the details by the # link gave a FRONT icon on an app called Manager that opened Manager.
         iPhones keep an icon by its address, so a new picture needs a new file name. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-manager-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Manager" />
    <script>
      // Old front links (…/tabla-eco/#/front…) move to the front app's own page, so saving them to the
      // Home Screen gives the Front app. Runs before anything else loads, and again when the # link changes.
      (function () {
        function toFront() {
          if (location.hash.indexOf('#/front') === 0) location.replace('./front/' + location.search + location.hash);
        }
        toFront();
        window.addEventListener('hashchange', toFront);
      })();
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- TVs: paint black from the very first frame (no white flash on load or reload). -->
    <style>html.t-dark, html.t-dark body { background: #000; }</style>
    <script>
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]');
        function apply() {
          var tv = location.hash.indexOf('#/tv') === 0;
          document.documentElement.classList.toggle('t-dark', tv);
          if (meta) meta.setAttribute('content', tv ? '#000000' : '#ffffff');
        }
        apply();
        window.addEventListener('hashchange', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- On a slow first visit the app's code takes a few seconds to arrive: say so instead of a blank white page.
         Appears only after half a second (no flash on a fast load), never on the TVs, gone once the app is on screen. -->
    <div id="boot-wait" aria-live="polite">Loading…</div>
    <style>
      #boot-wait { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #8a847a; font: 18px/1.4 system-ui, sans-serif; opacity: 0; animation: boot-wait-in 0.2s ease 0.5s forwards; pointer-events: none; }
      @keyframes boot-wait-in { to { opacity: 1; } }
      #root:not(:empty) ~ #boot-wait, html.t-dark #boot-wait { display: none; }
    </style>
    <!-- Shown only if the app never starts (e.g. a very old TV web viewer); hidden as soon as the app is on screen. -->
    <div id="boot-fail" hidden style="position: fixed; top: 0; left: 0; right: 0; padding: 48px; color: #888; font: 24px/1.4 sans-serif">
      This screen's web viewer is too old or failed to start. Update 'Android System WebView' (or Chrome) and restart.
    </div>
    <style>#root:not(:empty) ~ #boot-fail { display: none; }</style>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.firstChild) {
          document.getElementById('boot-fail').hidden = false;
          document.getElementById('boot-wait').style.display = 'none';
          // A screen nobody touches (TVs, kitchen) tries again by itself every minute, e.g. after the Wi-Fi
          // was down when it reloaded, instead of showing this message until someone restarts it.
          if (/^#\/(tv|kitchen)/.test(location.hash)) setTimeout(function () { location.reload(); }, 60000);
        }
      }, 20000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
