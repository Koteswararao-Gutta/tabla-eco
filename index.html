<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Tabla</title>
    <!-- Add to Home Screen: opens full screen like an app (iPhone and Android) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tabla" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- TVs: paint black from the very first frame (no white flash on load or reload). -->
    <style>html.t-dark, html.t-dark body { background: #000; }</style>
    <script>
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]');
        function apply() {
          var tv = location.hash.indexOf('#/tv') === 0;
          document.documentElement.classList.toggle('t-dark', tv);
          if (meta) meta.setAttribute('content', tv ? '#000000' : '#ffffff');
        }
        apply();
        window.addEventListener('hashchange', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
