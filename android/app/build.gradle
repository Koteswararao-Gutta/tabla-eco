plugins { id 'com.android.application' }

android {
    namespace 'com.tabla.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tabla.tv'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded onto the restaurant's own TVs, so the debug key is enough to install it.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
