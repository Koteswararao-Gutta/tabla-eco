name: Deploy server code
# Deploys functions/ (photo-to-order, reminders, Toast menu sync) and firestore.rules to Firebase
# after the Tests workflow passed on main (Firebase skips functions whose code didn't change).
# Needs two repository secrets: FIREBASE_SERVICE_ACCOUNT (JSON key) and ANTHROPIC_API_KEY.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: functions
  cancel-in-progress: false
env:
  PROJECT: tabla-eco-2e94b
  FIREBASE: npx --yes firebase-tools@15.36.0
jobs:
  # Deploy only the newest tested commit: a slower, older Tests run finishing late must not overwrite a newer deploy.
  # When two merges land close together, a waiting run can be dropped for a newer one (one deploy at a time),
  # so a run for an older commit deploys the tip of main instead when the tip's Tests already passed.
  latest:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.tip.outputs.ok }}
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$TESTED" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"; exit 0; fi  # started by hand
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" = "$TESTED" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "sha=$tip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          passed=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$tip&event=push&status=success" --jq .total_count)
          if [ "${passed:-0}" -gt 0 ]; then
            echo "::notice::$TESTED is no longer the tip of main; deploying the tip ($tip), whose tests passed."
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "sha=$tip" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: $TESTED is no longer the tip of main ($tip); the tip's own run deploys once its tests pass."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: latest
    if: needs.latest.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$SA" ] || [ -z "$KEY" ]; then
            if [ "$MANUAL" = "true" ]; then
              echo "::warning::Skipped: add the FIREBASE_SERVICE_ACCOUNT and ANTHROPIC_API_KEY secrets first."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Not deployed: the FIREBASE_SERVICE_ACCOUNT and ANTHROPIC_API_KEY secrets are missing."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          # A commit whose tests passed (see `latest`), not whatever main is by now.
          ref: ${{ needs.latest.outputs.sha }}
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.check.outputs.ready == 'true'
        run: npm ci --prefix functions && npm test --prefix functions
      - if: steps.check.outputs.ready == 'true'
        name: Sign in to Google Cloud
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - if: steps.check.outputs.ready == 'true'
        name: Store the Anthropic key in Secret Manager (only when it changed)
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          current=$($FIREBASE functions:secrets:access ANTHROPIC_API_KEY --project $PROJECT 2>/dev/null || true)
          if [ "$current" != "$KEY" ]; then
            printf '%s' "$KEY" | $FIREBASE functions:secrets:set ANTHROPIC_API_KEY --data-file=- --project $PROJECT --non-interactive --force
          fi
      - if: steps.check.outputs.ready == 'true'
        run: $FIREBASE deploy --only functions,firestore:rules --project $PROJECT --non-interactive --force
      - if: steps.check.outputs.ready == 'true'
        name: Remove old key versions
        continue-on-error: true
        run: $FIREBASE functions:secrets:prune --project $PROJECT --force
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
