name: Put menu pictures on TVs
# One-off: writes the real menu pictures to the live database (tools/menu-pictures/put.mjs).
on:
  push:
    branches: [claude/project-thread-x73hnz]
    paths: [tools/menu-pictures/**, .github/workflows/menu-pictures.yml]
permissions:
  contents: read
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund firebase-admin@14.5.1
        working-directory: tools/menu-pictures
      - run: node tools/menu-pictures/put.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
