name: Put ad videos on TVs
# One-off, started by hand by the owner (Actions > Put ad videos on TVs > Run workflow): adds the catering ad
# spot to the live loop (tools/ad-videos/put.mjs). Running it twice changes nothing new. Remove after use.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund firebase-admin@14.5.1
        working-directory: tools/ad-videos
      - run: node tools/ad-videos/put.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
