name: WhatsApp import (one-off)
# Runs tools/whatsapp-import on pushes to this branch only. Never merged to main.
on:
  push:
    branches: [claude/project-thread-vznwhy]
    paths: [tools/whatsapp-import/**]
permissions:
  contents: write
concurrency:
  group: whatsapp-import
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --prefix tools/whatsapp-import firebase-admin@14.5.1
      - run: mkdir -p out && node tools/whatsapp-import/run.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Save the menu to the branch (inspect only)
        run: |
          if [ -f out/menu.json ]; then
            cp out/menu.json tools/whatsapp-import/menu.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/whatsapp-import/menu.json
            git commit -m "Toast menu snapshot [skip ci]" || true
            git push
          fi
