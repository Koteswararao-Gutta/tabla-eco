name: Publish web app
# Publishes the site (and the Android screen app) only after the Tests workflow passed on main.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Deploy only the newest tested commit: a slower, older Tests run finishing late must not overwrite a newer deploy.
  latest:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.tip.outputs.ok }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$TESTED" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi  # started by hand
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" = "$TESTED" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: $TESTED is no longer the tip of main ($tip); the newer commit's run deploys."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: latest
    if: needs.latest.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the tests passed on (not whatever main is by now).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Android screen app, served from the same site: <site>/tabla.apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle -p android assembleRelease --no-daemon
        env: # signed with android/keystore/tabla-release.jks, so updates install over the old app
          TABLA_VERSION_CODE: ${{ github.run_number }}
          TABLA_VERSION_NAME: 1.${{ github.run_number }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk dist/tabla.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
