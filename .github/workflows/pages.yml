name: Publish web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Android screen app, served from the same site: <site>/tabla.apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle -p android assembleRelease --no-daemon
        env: # signed with android/keystore/tabla-release.jks, so updates install over the old app
          TABLA_VERSION_CODE: ${{ github.run_number }}
          TABLA_VERSION_NAME: 1.${{ github.run_number }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk dist/tabla.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
